<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>phone-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============================ Design tokens ============================ */
  :root {
    /* Layered surfaces (near-black) */
    --surface-page: #0A0B0D;
    --surface-card: #121417;
    --surface-input: #1A1D21;

    /* Single electric-blue accent — primary actions & active states ONLY */
    --accent: #3B82F6;
    --accent-muted: #1E3A5F;
    --accent-ring: rgba(59, 130, 246, 0.35);
    --accent-tint: rgba(59, 130, 246, 0.10);

    /* On-accent text + skeleton shimmer highlight */
    --on-accent: #FFFFFF;
    --shimmer: rgba(255, 255, 255, 0.05);

    /* Neutral text ramp */
    --text-primary: #F5F6F7;
    --text-secondary: #9BA1A8;
    --text-muted: #6B7280;

    /* Hairline borders (white at low alpha) */
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);

    /* Semantic — outcomes only */
    --booked: #34D399;            /* green  */
    --callback: #FBBF24;          /* amber  */
    --not-interested: #F87171;    /* red    */
    --voicemail: #9BA1A8;         /* gray   */
    --booked-tint: rgba(52, 211, 153, 0.12);
    --callback-tint: rgba(251, 191, 36, 0.12);
    --not-interested-tint: rgba(248, 113, 113, 0.12);
    --voicemail-tint: rgba(155, 161, 168, 0.12);

    /* Destructive */
    --danger: #F87171;
    --danger-tint: rgba(248, 113, 113, 0.10);

    /* Radius */
    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 999px;

    /* Spacing (4px scale) */
    --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
    --s-5: 20px; --s-6: 24px; --s-8: 32px;

    /* Motion */
    --t: 150ms ease;

    /* Type */
    --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --sidebar-w: 240px;
  }

  /* ============================== Base ================================== */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--surface-page);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
  .text-secondary { color: var(--text-secondary); }
  .text-muted { color: var(--text-muted); }
  .mt-6 { margin-top: var(--s-6); }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: var(--s-5) 0; }
  code { font-family: var(--font-mono); color: var(--text-secondary); }

  /* ============================= Layout ================================= */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    position: fixed; inset: 0 auto 0 0;
    width: var(--sidebar-w);
    background: var(--surface-card);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: var(--s-6) var(--s-4);
  }
  .brand {
    display: flex; align-items: center; gap: var(--s-2);
    font-weight: 600; font-size: 15px; letter-spacing: .2px;
    padding: 0 var(--s-3) var(--s-6);
  }
  .brand .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .brand .dim { color: var(--text-muted); font-weight: 400; }

  .nav { display: flex; flex-direction: column; gap: var(--s-1); }
  .nav-item {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-2) var(--s-3);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    text-decoration: none; cursor: pointer; font-weight: 500;
    transition: background var(--t), color var(--t);
    user-select: none;
  }
  .nav-item:hover { background: var(--surface-input); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-muted); color: var(--text-primary); }
  .nav-ico { width: 16px; height: 16px; flex: 0 0 16px; color: currentColor; }

  .sidebar-foot { margin-top: auto; padding-top: var(--s-4); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--s-3); }
  .whoami { font-size: 12px; color: var(--text-muted); padding: 0 var(--s-3); }

  .content { margin-left: var(--sidebar-w); flex: 1; min-width: 0; padding: var(--s-8); }
  .container { max-width: 1040px; }

  .topbar { display: flex; align-items: center; gap: var(--s-4); margin-bottom: var(--s-8); }
  .topbar h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .topbar .spacer { margin-left: auto; }
  .switcher { display: flex; align-items: center; gap: var(--s-2); }

  .view { display: none; }
  .view.active { display: block; }

  /* ============================= Cards ================================== */
  .card {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--s-6);
  }
  .card.pad-0 { padding: 0; }
  .stack > * + * { margin-top: var(--s-6); }

  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); font-weight: 600; margin: 0 0 var(--s-4); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 600; }

  /* =========================== Results hero ============================= */
  .hero { padding: var(--s-8); }
  .hero-value { font-family: var(--font-mono); font-weight: 600; font-size: 60px; line-height: 1; letter-spacing: -.03em; color: var(--text-primary); }
  .hero-label { margin-top: var(--s-3); color: var(--text-secondary); font-size: 14px; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s-4); }
  @media (max-width: 720px) { .stats { grid-template-columns: 1fr; } }
  .stat .label { display: block; }
  .stat-value { font-family: var(--font-mono); font-size: 28px; font-weight: 600; margin-top: var(--s-2); letter-spacing: -.02em; }

  /* ======================= Outcome breakdown =========================== */
  .bd-row { display: grid; grid-template-columns: 150px 1fr 48px 84px; align-items: center; gap: var(--s-3); padding: var(--s-2) 0; }
  .bd-row + .bd-row { border-top: 1px solid var(--border); }
  .bar { height: 6px; border-radius: var(--radius-pill); background: var(--surface-input); overflow: hidden; }
  .bar-fill { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--text-muted); transition: width var(--t); }
  .bar-fill[data-o="booked"] { background: var(--booked); }
  .bar-fill[data-o="callback_requested"] { background: var(--callback); }
  .bar-fill[data-o="not_interested"] { background: var(--not-interested); }
  .bar-fill[data-o="voicemail"] { background: var(--voicemail); }
  .bd-count { text-align: right; color: var(--text-primary); }
  .bd-val { text-align: right; color: var(--text-secondary); }

  /* ============================= Forms ================================= */
  input, select, textarea {
    font: inherit; color: var(--text-primary);
    background: var(--surface-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--s-2) var(--s-3);
    transition: border-color var(--t), box-shadow var(--t);
    min-width: 0;
  }
  input::placeholder { color: var(--text-muted); }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  input[readonly] { color: var(--text-secondary); }

  .field { display: flex; flex-direction: column; gap: var(--s-2); }
  .field > .label { margin: 0; }
  .form-row { display: flex; gap: var(--s-4); align-items: flex-end; flex-wrap: wrap; }
  .form-row .field { flex: 1; min-width: 160px; }

  /* ============================ Buttons ================================ */
  .btn {
    font: inherit; font-weight: 500; cursor: pointer;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: var(--s-2) var(--s-4);
    display: inline-flex; align-items: center; gap: var(--s-2);
    transition: background var(--t), border-color var(--t), color var(--t), filter var(--t);
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: transparent; color: var(--text-primary); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--border-strong); background: var(--surface-input); }
  .btn-danger { background: transparent; color: var(--danger); border-color: transparent; padding: var(--s-2) var(--s-3); }
  .btn-danger:hover { background: var(--danger-tint); }
  .btn-sm { padding: var(--s-1) var(--s-3); font-size: 13px; }

  /* ============================ Tables ================================= */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-muted); font-weight: 600; padding: var(--s-3) var(--s-5);
    border-bottom: 1px solid var(--border);
  }
  tbody td { padding: var(--s-3) var(--s-5); border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background var(--t); }
  tbody tr:hover { background: var(--surface-input); }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions .btn + .btn { margin-left: var(--s-1); }

  /* ============================= Badges ================================ */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 8px; border-radius: 6px;
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary); border: 1px solid var(--border); background: transparent;
  }
  .badge.mono { font-size: 11px; }
  .badge-outcome[data-o="booked"] { color: var(--booked); background: var(--booked-tint); border-color: var(--booked-tint); }
  .badge-outcome[data-o="callback_requested"] { color: var(--callback); background: var(--callback-tint); border-color: var(--callback-tint); }
  .badge-outcome[data-o="not_interested"] { color: var(--not-interested); background: var(--not-interested-tint); border-color: var(--not-interested-tint); }
  .badge-outcome[data-o="voicemail"] { color: var(--voicemail); background: var(--voicemail-tint); border-color: var(--voicemail-tint); }

  /* ========================= Call history ============================== */
  .filter-row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--border); }
  .filter-row .count { margin-left: auto; font-size: 13px; color: var(--text-muted); }
  .call { padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--border); }
  .call:last-child { border-bottom: none; }
  .call-head { display: flex; align-items: center; gap: var(--s-3); cursor: pointer; }
  .call-head .who { font-weight: 500; }
  .call-head .meta { color: var(--text-muted); font-size: 13px; margin-left: auto; display: flex; gap: var(--s-4); }
  .caret { color: var(--text-muted); transition: transform var(--t); display: inline-block; width: 10px; }
  .call.open .caret { transform: rotate(90deg); }
  .call-summary { margin: var(--s-2) 0 0; color: var(--text-secondary); }
  .call-details { display: none; margin-top: var(--s-3); }
  .call.open .call-details { display: block; }
  .call-meta { margin: var(--s-1) 0; font-size: 13px; color: var(--text-secondary); }
  .call-meta strong { color: var(--text-primary); font-weight: 500; }
  pre.transcript {
    white-space: pre-wrap; word-break: break-word;
    background: var(--surface-input); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: var(--s-3); margin: 0 0 var(--s-3);
    max-height: 340px; overflow: auto;
    font: 13px/1.6 var(--font-mono); color: var(--text-secondary);
  }
  audio { width: 100%; margin-top: var(--s-1); }

  /* ============================ Settings =============================== */
  .status-row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) 0; }
  .status-row + .status-row { border-top: 1px solid var(--border); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .dot.on { background: var(--booked); }
  .status-row .name { font-weight: 500; }
  .status-row .state { margin-left: auto; color: var(--text-muted); font-size: 13px; }

  /* ============================ Empty ================================== */
  .empty { padding: var(--s-5); color: var(--text-muted); }

  /* =========================== Skeletons =============================== */
  .skeleton { position: relative; overflow: hidden; background: var(--surface-input); border-radius: var(--radius-sm); display: inline-block; }
  .skeleton::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, var(--shimmer), transparent);
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .sk-line { height: 12px; border-radius: 6px; }
  .sk-hero { height: 56px; width: 240px; }

  /* ============================= Toast ================================= */
  .toast {
    position: fixed; bottom: var(--s-6); left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--surface-card); border: 1px solid var(--border);
    color: var(--text-primary);
    padding: var(--s-3) var(--s-4); border-radius: var(--radius-sm);
    opacity: 0; transition: opacity var(--t), transform var(--t);
    pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  .row-gap { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; }
  .valgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--s-3); }
</style>
</head>
<body>
<div class="app">
  <!-- ============================ Sidebar ============================ -->
  <aside class="sidebar">
    <div class="brand"><span class="logo-dot"></span> phone-agent</div>
    <nav class="nav">
      <a class="nav-item" data-view="overview">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>
        <span>Overview</span>
      </a>
      <a class="nav-item" data-view="contacts">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M3.5 13c0-2.2 2-3.6 4.5-3.6s4.5 1.4 4.5 3.6"/></svg>
        <span>Contacts</span>
      </a>
      <a class="nav-item" data-view="calls">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.2 6 3l1 2.5-1.4 1a7 7 0 0 0 3.9 3.9l1-1.4 2.5 1 -.2 2.5c-5 .6-9.6-4-9-9z"/></svg>
        <span>Calls</span>
      </a>
      <a class="nav-item" data-view="clients">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="5.5" cy="6" r="2"/><path d="M1.8 12.5c0-1.9 1.6-3 3.7-3"/><circle cx="10.8" cy="6.4" r="1.7"/><path d="M8.6 12.5c.2-1.7 1.5-2.7 3.2-2.7 1.3 0 2.4.6 2.8 2"/></svg>
        <span>Clients</span>
      </a>
      <a class="nav-item" data-view="settings">
        <svg class="nav-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 5h4M11 5h2"/><circle cx="9" cy="5" r="1.5"/><path d="M3 11h2M9 11h4"/><circle cx="7" cy="11" r="1.5"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="whoami" id="whoami"></div>
      <button class="btn btn-secondary" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <!-- ============================ Content ============================ -->
  <main class="content">
    <div class="container">
      <div class="topbar">
        <h1 id="viewTitle">Overview</h1>
        <div class="spacer"></div>
        <div class="switcher">
          <span class="label">Client</span>
          <select id="clientSwitcher" aria-label="Client workspace"></select>
        </div>
      </div>

      <!-- ---------------------- Overview ---------------------- -->
      <section class="view" data-view="overview">
        <div class="stack">
          <div class="card hero">
            <div class="hero-value mono" id="rValue"><span class="skeleton sk-hero"></span></div>
            <div class="hero-label">Estimated value <span class="text-muted" id="resultsScope"></span></div>
          </div>
          <div class="stats">
            <div class="card stat"><span class="label">Jobs booked / shifts filled</span><div class="stat-value mono" id="rJobs"><span class="skeleton sk-line" style="width:56px"></span></div></div>
            <div class="card stat"><span class="label">Calls made</span><div class="stat-value mono" id="rCalls"><span class="skeleton sk-line" style="width:56px"></span></div></div>
          </div>
          <div class="card">
            <div class="section-title">Outcome breakdown</div>
            <div id="breakdownBody"></div>
          </div>
        </div>
      </section>

      <!-- ---------------------- Contacts ---------------------- -->
      <section class="view" data-view="contacts">
        <div class="stack">
          <div class="card">
            <div class="section-title">Add contact</div>
            <form class="form-row" id="addForm">
              <div class="field"><label class="label" for="addName">Name</label><input type="text" id="addName" placeholder="Jane Doe" autocomplete="off" required /></div>
              <div class="field"><label class="label" for="addPhone">Phone</label><input type="text" id="addPhone" class="mono" placeholder="+15551234567" autocomplete="off" required /></div>
              <button type="submit" class="btn btn-primary">Add contact</button>
            </form>
          </div>
          <div class="card pad-0">
            <table>
              <thead><tr><th>Name</th><th>Phone</th><th></th></tr></thead>
              <tbody id="contactsBody"></tbody>
            </table>
            <div class="empty" id="contactsEmpty" hidden>No contacts yet.</div>
          </div>
        </div>
      </section>

      <!-- ------------------------ Calls ----------------------- -->
      <section class="view" data-view="calls">
        <div class="card pad-0">
          <div class="filter-row">
            <span class="label">Outcome</span>
            <select id="outcomeFilter">
              <option value="">All</option>
              <option value="reached">reached</option>
              <option value="voicemail">voicemail</option>
              <option value="not_interested">not_interested</option>
              <option value="interested">interested</option>
              <option value="booked">booked</option>
              <option value="callback_requested">callback_requested</option>
              <option value="__none">(no outcome)</option>
            </select>
            <span class="count" id="callsCount"></span>
          </div>
          <div id="callsList"></div>
          <div class="empty" id="callsEmpty" hidden>No calls recorded yet.</div>
        </div>
      </section>

      <!-- ----------------------- Clients ---------------------- -->
      <section class="view" data-view="clients">
        <div class="card">
          <div class="section-title">Client settings</div>
          <div id="clientConfig"></div>
        </div>
      </section>

      <!-- ---------------------- Settings ---------------------- -->
      <section class="view" data-view="settings">
        <div class="stack">
          <div class="card">
            <div class="section-title">Integrations</div>
            <div class="status-row"><span class="dot" id="vapiDot"></span><span class="name">Vapi</span><span class="state" id="vapiState">—</span></div>
            <div class="status-row"><span class="dot" id="twilioDot"></span><span class="name">Twilio</span><span class="state" id="twilioState">—</span></div>
          </div>
          <div class="card">
            <div class="section-title">Session</div>
            <div class="text-secondary">Signed in as <strong class="mono" id="settingsUser"></strong></div>
            <div class="row-gap mt-6"><button class="btn btn-secondary" id="logoutBtn2">Log out</button></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  if (res.status === 401) { window.location = "/login"; throw new Error("Not signed in"); }
  const data = res.status === 204 ? null : await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

function fmtDuration(sec) {
  if (sec == null) return "—";
  const m = Math.floor(sec / 60);
  return m + ":" + String(sec % 60).padStart(2, "0");
}

// --- View router ----------------------------------------------------------
const VIEW_TITLES = { overview: "Overview", contacts: "Contacts", calls: "Calls", clients: "Clients", settings: "Settings" };
function showView(name) {
  if (!VIEW_TITLES[name]) name = "overview";
  $$(".view").forEach((v) => v.classList.toggle("active", v.dataset.view === name));
  $$(".nav-item").forEach((a) => a.classList.toggle("active", a.dataset.view === name));
  $("#viewTitle").textContent = VIEW_TITLES[name];
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
}
$$(".nav-item").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); showView(a.dataset.view); }));
window.addEventListener("hashchange", () => showView(location.hash.slice(1) || "overview"));

// --- Skeletons ------------------------------------------------------------
function sk(w) { return '<span class="skeleton sk-line" style="width:' + w + '"></span>'; }
function showSkeletons() {
  $("#contactsBody").innerHTML = Array.from({ length: 4 }, () =>
    '<tr><td>' + sk("140px") + '</td><td>' + sk("110px") + '</td><td></td></tr>').join("");
  $("#callsList").innerHTML = Array.from({ length: 4 }, () =>
    '<div class="call"><div class="call-head"><span class="caret"></span>' + sk("120px") +
    '<span class="meta">' + sk("80px") + '</span></div></div>').join("");
  $("#breakdownBody").innerHTML = Array.from({ length: 4 }, () =>
    '<div class="bd-row">' + sk("120px") + '<div class="bar"></div>' + sk("30px") + sk("60px") + '</div>').join("");
}

// --- Multi-tenant scope ---------------------------------------------------
let ME = null;
// Persist the selected client across refreshes so scope/state isn't lost.
let SELECTED_CLIENT = (() => { try { return localStorage.getItem("pa_client") || ""; } catch { return ""; } })();
let CURRENCY = "USD";
const OUTCOMES = ["reached", "voicemail", "not_interested", "interested", "booked", "callback_requested"];
const clientById = {};

function setSelectedClient(v) {
  SELECTED_CLIENT = v || "";
  try { localStorage.setItem("pa_client", SELECTED_CLIENT); } catch {}
}

function q(url) {
  if (!SELECTED_CLIENT) return url;
  return url + (url.includes("?") ? "&" : "?") + "client_id=" + encodeURIComponent(SELECTED_CLIENT);
}
function money(n) {
  try {
    return new Intl.NumberFormat(undefined, { style: "currency", currency: CURRENCY, maximumFractionDigits: 0 }).format(n || 0);
  } catch { return "$" + (n || 0); }
}

async function loadMe() {
  ME = await api("GET", "/api/me");
  $("#whoami").textContent = ME.username ? "Signed in as " + ME.username : "";
  $("#settingsUser").textContent = ME.username || "";
  const sw = $("#clientSwitcher");
  sw.innerHTML = "";
  const optAll = document.createElement("option");
  optAll.value = ""; optAll.textContent = "All clients";
  sw.appendChild(optAll);
  for (const c of (ME.clients || [])) {
    clientById[c.id] = c;
    const o = document.createElement("option");
    o.value = String(c.id); o.textContent = c.name;
    sw.appendChild(o);
  }
  // Drop a stale selection (e.g. a deleted client) rather than silently
  // falling back to "all clients".
  if (SELECTED_CLIENT && !clientById[SELECTED_CLIENT]) setSelectedClient("");
  sw.value = SELECTED_CLIENT;
}

$("#clientSwitcher").addEventListener("change", (e) => {
  setSelectedClient(e.target.value);
  refreshAll();
});

// --- Overview (results) ---------------------------------------------------
async function loadResults() {
  const r = await api("GET", q("/api/results"));
  CURRENCY = r.currency || "USD";
  $("#rValue").textContent = money(r.estimated_value);
  $("#rJobs").textContent = r.jobs_booked;
  $("#rCalls").textContent = r.total_calls;
  const name = SELECTED_CLIENT && clientById[SELECTED_CLIENT] ? clientById[SELECTED_CLIENT].name : "all clients";
  $("#resultsScope").textContent = "· " + name;
  renderBreakdown(r.breakdown || []);
}

function renderBreakdown(rows) {
  const max = Math.max(1, ...rows.map((b) => b.count));
  $("#breakdownBody").innerHTML = rows.map((b) => {
    const pct = Math.round((b.count / max) * 100);
    return '<div class="bd-row">' +
      outcomeBadge(b.outcome) +
      '<div class="bar"><span class="bar-fill" data-o="' + esc(b.outcome) + '" style="width:' + pct + '%"></span></div>' +
      '<span class="mono bd-count">' + b.count + '</span>' +
      '<span class="mono bd-val">' + (b.value ? money(b.value) : "—") + '</span>' +
    '</div>';
  }).join("");
}

// --- Clients (config) -----------------------------------------------------
function renderClientConfig() {
  const box = $("#clientConfig");
  if (!SELECTED_CLIENT) {
    box.innerHTML =
      '<p class="text-secondary" style="margin-top:0">Select a client in the switcher above to edit its per-outcome values, login, and API key — or create one.</p>' +
      '<form class="form-row mt-6" id="newClientForm"><div class="field"><label class="label" for="newClientName">New client name</label>' +
      '<input type="text" id="newClientName" placeholder="Acme Plumbing" /></div>' +
      '<button class="btn btn-primary" type="submit">Create client</button></form>';
    return;
  }
  const c = clientById[SELECTED_CLIENT] || { outcome_values: {} };
  const vals = c.outcome_values || {};
  const inputs = OUTCOMES.map((o) =>
    '<div class="field"><label class="label">' + o + '</label>' +
    '<input type="number" step="1" min="0" class="mono" data-outcome="' + o + '" value="' +
    (vals[o] != null ? esc(vals[o]) : "") + '" placeholder="0" /></div>'
  ).join("");
  const isDefault = ME && Number(SELECTED_CLIENT) === ME.default_client_id;
  box.innerHTML =
    '<p class="text-secondary" style="margin-top:0">Per-outcome dollar value for <strong>' + esc(c.name) + '</strong> — drives the estimated value.</p>' +
    '<div class="valgrid" style="margin-top:var(--s-4)" id="valGrid">' + inputs + '</div>' +
    '<div class="row-gap" style="margin-top:var(--s-4)"><button class="btn btn-primary" id="saveVals">Save values</button></div>' +
    '<hr class="divider" />' +
    '<div class="section-title">Client login</div>' +
    '<p class="text-secondary" style="margin-top:0">' + (c.has_login ? 'Set for user "' + esc(c.username || "") + '".' : 'Not set yet.') +
    ' Lets this client sign in to their read-only workspace.</p>' +
    '<form class="form-row mt-6" id="loginForm"><div class="field"><label class="label" for="clUser">Username</label>' +
    '<input type="text" id="clUser" autocomplete="off" value="' + esc(c.username || "") + '" /></div>' +
    '<div class="field"><label class="label" for="clPass">New password</label><input type="password" id="clPass" autocomplete="new-password" /></div>' +
    '<button class="btn btn-primary" type="submit">Set login</button></form>' +
    '<hr class="divider" />' +
    '<div class="section-title">Trigger API key</div>' +
    '<p class="text-secondary" style="margin-top:0">External systems send this as a bearer token to <code>POST /api/trigger/call</code>; calls attribute to this client.</p>' +
    '<div class="row-gap mt-6"><input type="text" id="apiKey" class="mono" readonly value="' + esc(c.api_key || "(none)") + '" style="flex:1;min-width:280px" />' +
    '<button class="btn btn-secondary" id="copyKey">Copy</button><button class="btn btn-danger" id="regenKey">Regenerate</button></div>' +
    (isDefault ? '' :
      '<hr class="divider" />' +
      '<div class="section-title">Danger zone</div>' +
      '<div class="row-gap"><button class="btn btn-danger" id="delClient">Delete client</button>' +
      '<span class="text-muted">Permanently removes this client and all of its contacts, calls, and results.</span></div>');

  $("#saveVals").onclick = async () => {
    const outcome_values = {};
    box.querySelectorAll("#valGrid input").forEach((el) => {
      const v = el.value.trim(); if (v !== "") outcome_values[el.dataset.outcome] = Number(v);
    });
    try {
      clientById[SELECTED_CLIENT] = await api("PUT", "/api/clients/" + SELECTED_CLIENT + "/values", { outcome_values });
      toast("Values saved"); loadResults();
    } catch (e) { toast(e.message, true); }
  };
  $("#copyKey").onclick = () => {
    const v = $("#apiKey").value;
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(() => toast("Key copied")).catch(() => {});
    else { $("#apiKey").select(); document.execCommand("copy"); toast("Key copied"); }
  };
  $("#regenKey").onclick = async () => {
    if (!confirm("Regenerate this client's API key? The old key stops working immediately.")) return;
    try {
      clientById[SELECTED_CLIENT] = await api("POST", "/api/clients/" + SELECTED_CLIENT + "/key");
      toast("API key regenerated"); renderClientConfig();
    } catch (e) { toast(e.message, true); }
  };
  const delBtn = $("#delClient");
  if (delBtn) delBtn.onclick = async () => {
    if (!confirm('Delete client "' + c.name + '" and ALL of its contacts, calls, and results? This cannot be undone.')) return;
    try {
      await api("DELETE", "/api/clients/" + SELECTED_CLIENT);
      toast("Client deleted");
      delete clientById[SELECTED_CLIENT];
      setSelectedClient("");
      await loadMe();
      $("#clientSwitcher").value = "";
      refreshAll();
    } catch (e) { toast(e.message, true); }
  };
}

async function refreshAll() {
  await Promise.all([
    loadResults().catch((e) => toast(e.message, true)),
    loadContacts().catch((e) => toast(e.message, true)),
    loadCalls().catch((e) => toast(e.message, true)),
  ]);
  renderClientConfig();
}

// --- Settings (status) ----------------------------------------------------
async function loadStatus() {
  try {
    const s = await api("GET", "/api/status");
    setDot("#vapiDot", "#vapiState", s.vapi);
    setDot("#twilioDot", "#twilioState", s.twilio);
  } catch (e) { /* leave neutral */ }
}
function setDot(dotSel, stateSel, on) {
  $(dotSel).classList.toggle("on", !!on);
  $(stateSel).textContent = on ? "Connected" : "Not configured";
}

// --- Contacts -------------------------------------------------------------
async function loadContacts() {
  const rows = await api("GET", q("/api/contacts"));
  const body = $("#contactsBody");
  body.innerHTML = "";
  $("#contactsEmpty").hidden = rows.length > 0;
  for (const c of rows) body.appendChild(contactRow(c));
}

function contactRow(c) {
  const tr = document.createElement("tr");
  tr.dataset.id = c.id;
  tr.innerHTML =
    '<td>' + esc(c.name) + '</td>' +
    '<td class="mono text-secondary">' + esc(c.phone) + '</td>' +
    '<td class="actions">' +
      '<button class="btn btn-secondary btn-sm edit">Edit</button>' +
      '<button class="btn btn-danger btn-sm del">Delete</button>' +
    '</td>';
  tr.querySelector(".edit").onclick = () => startEdit(tr, c);
  tr.querySelector(".del").onclick = () => removeContact(c);
  return tr;
}

function startEdit(tr, c) {
  tr.innerHTML =
    '<td><input type="text" class="e-name" value="' + esc(c.name) + '"></td>' +
    '<td><input type="text" class="e-phone mono" value="' + esc(c.phone) + '"></td>' +
    '<td class="actions">' +
      '<button class="btn btn-primary btn-sm save">Save</button>' +
      '<button class="btn btn-secondary btn-sm cancel">Cancel</button>' +
    '</td>';
  tr.querySelector(".save").onclick = async () => {
    const name = tr.querySelector(".e-name").value.trim();
    const phone = tr.querySelector(".e-phone").value.trim();
    try {
      await api("PUT", "/api/contacts/" + c.id, { name, phone });
      toast("Contact updated");
      loadContacts();
    } catch (e) { toast(e.message, true); }
  };
  tr.querySelector(".cancel").onclick = () => loadContacts();
  tr.querySelector(".e-name").focus();
}

async function removeContact(c) {
  if (!confirm('Delete contact "' + c.name + '"?')) return;
  try {
    await api("DELETE", "/api/contacts/" + c.id);
    toast("Contact deleted");
    loadContacts();
  } catch (e) { toast(e.message, true); }
}

// --- Form handlers ---------------------------------------------------------
// All forms submit through ONE delegated listener that always preventDefaults,
// so a native form submit (page reload) can never happen — even across the
// client-config re-renders.
async function handleAddContact() {
  const name = $("#addName").value.trim();
  const phone = $("#addPhone").value.trim();
  if (!name || !phone) { toast("Name and phone are required.", true); return; }
  try {
    await api("POST", q("/api/contacts"), { name, phone });
    $("#addName").value = ""; $("#addPhone").value = "";
    toast("Contact added");
    loadContacts();
  } catch (e) { toast(e.message, true); }
}

async function handleCreateClient() {
  const name = $("#newClientName").value.trim();
  if (!name) { toast("Client name is required.", true); return; }
  try {
    const c = await api("POST", "/api/clients", { name });
    toast("Client created");
    await loadMe();
    setSelectedClient(String(c.id));
    $("#clientSwitcher").value = SELECTED_CLIENT;
    refreshAll();
  } catch (e) { toast(e.message, true); }
}

async function handleSetLogin() {
  const username = $("#clUser").value.trim();
  const password = $("#clPass").value;
  if (!username || !password) { toast("Username and password are required.", true); return; }
  try {
    clientById[SELECTED_CLIENT] = await api("PUT", "/api/clients/" + SELECTED_CLIENT + "/login", { username, password });
    toast('Login set — this client can sign in as "' + username + '".');
    renderClientConfig();
  } catch (e) { toast(e.message, true); }
}

document.addEventListener("submit", (ev) => {
  const id = ev.target && ev.target.id;
  if (id !== "addForm" && id !== "newClientForm" && id !== "loginForm") return;
  ev.preventDefault();
  if (id === "addForm") handleAddContact();
  else if (id === "newClientForm") handleCreateClient();
  else handleSetLogin();
});

// --- Calls ----------------------------------------------------------------
let allCalls = [];

async function loadCalls() {
  allCalls = await api("GET", q("/api/calls"));
  renderCalls();
}

function renderCalls() {
  const filter = $("#outcomeFilter").value;
  const calls = allCalls.filter((c) => {
    if (!filter) return true;
    if (filter === "__none") return !c.outcome;
    return c.outcome === filter;
  });
  const list = $("#callsList");
  list.innerHTML = "";
  $("#callsEmpty").hidden = allCalls.length > 0;
  for (const call of calls) list.appendChild(callRow(call));

  const count = filter
    ? calls.length + " of " + allCalls.length + " call(s)"
    : allCalls.length + " call(s)";
  $("#callsCount").textContent = allCalls.length ? count : "";
}

$("#outcomeFilter").addEventListener("change", renderCalls);

function statusBadge(status) {
  if (!status) return '<span class="badge">unknown</span>';
  return '<span class="badge">' + esc(status) + '</span>';
}

function outcomeBadge(outcome) {
  if (!outcome) return "";
  return '<span class="badge badge-outcome" data-o="' + esc(outcome) + '">' + esc(String(outcome).replace(/_/g, " ")) + '</span>';
}

function tagBadge(tag) {
  if (!tag) return "";
  return '<span class="badge mono" title="Source tag">' + esc(tag) + '</span>';
}

function callRow(call) {
  const div = document.createElement("div");
  div.className = "call";
  const who = call.contact_name || call.customer_number || "Unknown";
  const hasDetails = call.transcript || call.recording_url || call.callback_time || call.notes;

  const head =
    '<div class="call-head">' +
      '<span class="caret">' + (hasDetails ? "▶" : "") + '</span>' +
      '<span class="who">' + esc(who) + '</span>' +
      statusBadge(call.ended_reason || call.status) +
      outcomeBadge(call.outcome) +
      tagBadge(call.source_tag) +
      '<span class="meta">' +
        '<span class="mono">' + fmtDuration(call.duration_seconds) + '</span>' +
        '<span class="mono">' + esc((call.updated_at || "").replace("T", " ")) + '</span>' +
      '</span>' +
    '</div>';

  const summary = call.summary
    ? '<p class="call-summary">' + esc(call.summary) + '</p>'
    : '<p class="call-summary text-muted">No summary.</p>';

  let details = '<div class="call-details">';
  if (call.callback_time) details += '<p class="call-meta"><strong>Callback:</strong> ' + esc(call.callback_time) + '</p>';
  if (call.notes) details += '<p class="call-meta"><strong>Notes:</strong> ' + esc(call.notes) + '</p>';
  if (call.transcript) details += '<pre class="transcript">' + esc(call.transcript) + '</pre>';
  if (call.recording_url) details += '<audio controls preload="none" src="' + esc(call.recording_url) + '"></audio>';
  if (!hasDetails) details += '<span class="text-muted">No transcript or recording.</span>';
  details += '</div>';

  div.innerHTML = head + summary + details;
  div.querySelector(".call-head").onclick = () => { if (hasDetails) div.classList.toggle("open"); };
  return div;
}

// --- Logout ---------------------------------------------------------------
async function logout() {
  try { await fetch("/logout", { method: "POST" }); } catch (e) { /* ignore */ }
  window.location = "/login";
}
$("#logoutBtn").addEventListener("click", logout);
$("#logoutBtn2").addEventListener("click", logout);

// --- Boot -----------------------------------------------------------------
async function boot() {
  showView(location.hash.slice(1) || "overview");
  showSkeletons();
  await loadMe().catch((e) => toast(e.message, true));
  await Promise.all([
    loadStatus(),
    loadResults().catch((e) => toast(e.message, true)),
    loadContacts().catch((e) => toast(e.message, true)),
    loadCalls().catch((e) => toast(e.message, true)),
  ]);
  renderClientConfig();
}
boot();
setInterval(() => loadCalls().catch(() => {}), 15000);
</script>
</body>
</html>
