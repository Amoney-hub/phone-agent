<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>phone-agent · sign in</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #171b22;
    --panel-2: #1e232c;
    --border: #2a313c;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --accent-2: #3b82f6;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; width: 340px; max-width: 92vw;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .3px; }
  h1 .dim { color: var(--muted); font-weight: 400; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  input:focus { outline: none; border-color: var(--accent-2); }
  button {
    width: 100%; margin-top: 20px; cursor: pointer;
    font: inherit; color: #fff; background: var(--accent-2);
    border: 1px solid var(--accent-2); border-radius: 8px; padding: 10px 12px;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err {
    margin-top: 14px; color: var(--bad); font-size: 14px; min-height: 18px;
  }
</style>
</head>
<body>
<form class="card" id="loginForm">
  <h1>phone-agent <span class="dim">sign in</span></h1>
  <p class="sub">Enter your dashboard credentials.</p>
  <label for="username">Username</label>
  <input type="text" id="username" name="username" autocomplete="username" autofocus required />
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required />
  <button type="submit" id="submitBtn">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
const form = document.getElementById("loginForm");
const err = document.getElementById("err");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.textContent = "";
  btn.disabled = true;
  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    if (res.ok) {
      window.location = "/";
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || "Sign in failed.";
  } catch (e) {
    err.textContent = "Network error. Try again.";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
