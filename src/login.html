<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>phone-agent · sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --surface-page: #0A0B0D;
    --surface-card: #121417;
    --surface-input: #1A1D21;
    --accent: #3B82F6;
    --accent-ring: rgba(59, 130, 246, 0.35);
    --on-accent: #FFFFFF;
    --text-primary: #F5F6F7;
    --text-secondary: #9BA1A8;
    --text-muted: #6B7280;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --danger: #F87171;
    --radius: 12px;
    --radius-sm: 8px;
    --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px; --s-8: 32px;
    --t: 150ms ease;
    --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--surface-page); color: var(--text-primary);
    font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: var(--s-6);
  }
  .card {
    background: var(--surface-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: var(--s-8);
    width: 360px; max-width: 100%;
  }
  .brand { display: flex; align-items: center; gap: var(--s-2); font-weight: 600; font-size: 14px; color: var(--text-secondary); }
  .brand .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  h1 { font-size: 22px; font-weight: 600; margin: var(--s-4) 0 var(--s-2); letter-spacing: -.01em; }
  p.sub { color: var(--text-secondary); margin: 0 0 var(--s-6); font-size: 14px; }
  .field { display: flex; flex-direction: column; gap: var(--s-2); margin-top: var(--s-4); }
  label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 600; }
  input {
    width: 100%; font: inherit; color: var(--text-primary);
    background: var(--surface-input); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: var(--s-3);
    transition: border-color var(--t), box-shadow var(--t);
  }
  input::placeholder { color: var(--text-muted); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  button {
    width: 100%; margin-top: var(--s-6); cursor: pointer; font: inherit; font-weight: 500;
    color: var(--on-accent); background: var(--accent); border: 1px solid var(--accent);
    border-radius: var(--radius-sm); padding: var(--s-3);
    transition: filter var(--t);
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: default; filter: none; }
  .err { margin-top: var(--s-4); color: var(--danger); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<form class="card" id="loginForm">
  <div class="brand"><span class="logo-dot"></span> phone-agent</div>
  <h1>Sign in</h1>
  <p class="sub">Enter your workspace credentials.</p>
  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required />
  </div>
  <button type="submit" id="submitBtn">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
const form = document.getElementById("loginForm");
const err = document.getElementById("err");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.textContent = "";
  btn.disabled = true;
  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    if (res.ok) {
      window.location = "/";
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || "Sign in failed.";
  } catch (e) {
    err.textContent = "Network error. Try again.";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
